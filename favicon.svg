<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" shape-rendering="geometricPrecision">
  <style>
    .layer { fill: #1E293B; }
    .keystone { fill: #E05A2B; }
    @media (prefers-color-scheme: dark) {
      .layer { fill: #CBD5E1; }
      .keystone { fill: #FB7144; }
    }
  </style>
  <rect x="2" y="2" width="16" height="6" rx="2" class="layer"/>
  <rect x="4.5" y="12" width="16" height="6" rx="2" class="layer"/>
  <rect x="2" y="22" width="16" height="6" rx="2" class="layer"/>
  <rect x="23" y="2" width="5" height="26" rx="2" class="keystone"/>
</svg>
